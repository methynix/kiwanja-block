; Single-node setup + CORS so the PWA (PouchDB) can sync directly with CouchDB.
[couchdb]
single_node = true
uuid = 05f93846e6782baa5e78f5d031404c02

[chttpd]
enable_cors = true

[cors]
origins = http://localhost:5173
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer
